
[package]
name = "atomic-time"
version = "1.0.0"
edition = "2021"
repository = "https://github.com/al8n/atomic-time"
homepage = "https://github.com/al8n/atomic-time"
documentation = "https://docs.rs/atomic-time"
description = "Thread-safe atomic time types, lock-free where supported"
license = "MIT OR Apache-2.0"
rust-version = "1.85"
keywords = [
  "atomic",
  "no_std",
  "atomic-duration",
  "atomic-instant",
  "atomic-systemtime",
]
categories = [
  "development-tools",
  "concurrency",
  "no-std"
]
exclude = ["benchmark", ".DS_Store", "output"]

[features]
default = ["std"]
std = ["portable-atomic/std", "serde?/std"]
serde = ["dep:serde"]
arbitrary = ["std", "dep:arbitrary"]
quickcheck = ["std", "dep:quickcheck"]
proptest = ["std", "dep:proptest"]

[dependencies]
portable-atomic = "1.15"
serde = { version = "1", optional = true, default-features = false }
arbitrary = { version = "1", optional = true, default-features = false }
quickcheck = { version = "1", optional = true, default-features = false }
proptest = { version = "1", optional = true, default-features = false, features = ["std"] }

[dev-dependencies]
serde_json = "1"

[profile.bench]
opt-level = 3
debug = false
codegen-units = 1
lto = 'thin'
incremental = false
debug-assertions = false
overflow-checks = false
rpath = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
rust_2018_idioms = "warn"
single_use_lifetimes = "warn"
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(all_tests)',
] }
